# Posts whose file was renamed: the old URL is still in Google's index and in
# external links, so it must 301 to the new one instead of answering 404.
# Add a line here whenever a post's slug, month or year changes.
map $uri $renamed_post {
    /2026/04/arquitecutra-cliente-servidor  /2026/04/arquitectura-cliente-servidor;
    /2026/04/arquitecutra-monolitica        /2026/04/arquitectura-monolitica;
    /2026/03/B-R1-2026-robin                /2026/03/B-R1-round-robin-scheduling;
}

# Legacy category filter (/?categoria=...) → indexable route /categoria/:slug.
# Without a server redirect the old URL answers 200 with the home page's
# canonical and only redirects in JavaScript.
map $arg_categoria $legacy_category {
    tecnologia                /categoria/tecnologia;
    programacion-competitiva  /categoria/programacion-competitiva;
}

map $arg_q $search_query_suffix {
    ""       "";
    default  "?q=$arg_q";
}

# Search result pages (?q=...) are thin duplicates of the listings and, with
# no results, soft 404s. Keep them out of the index but let links be followed.
map $arg_q $search_robots {
    ""       "";
    default  "noindex, follow";
}

# Hashed build assets never change; public images (authors, diagrams,
# og-default) keep their name between deploys, so they get a shorter TTL.
# HTML, feeds and the sitemap revalidate every time (cheap 304s via ETag).
map $uri $cache_control {
    ~^/assets/                                "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico)$  "public, max-age=604800";
    default                                   "no-cache";
}

server {
    listen 80;
    server_name blog.jesusflorez.cloud;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Emit relative Location headers. Behind the TLS proxy nginx only listens on
    # port 80, so absolute redirects would downgrade https:// links to http://.
    absolute_redirect off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss application/rss+xml text/javascript image/svg+xml image/x-icon;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Every header lives at server level: an add_header inside a location
    # would silently drop all of these for that location.
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $search_robots always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    if ($renamed_post) {
        return 301 $renamed_post;
    }

    # Canonical URLs carry no trailing slash (sitemap, canonical, JSON-LD all
    # agree). Consolidate the slash variant Google already crawled.
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # /2026/01/post.html is the prerendered file behind /2026/01/post; serving
    # it directly would create a duplicate URL.
    location ~ ^(/.+)\.html$ {
        return 301 $1$is_args$args;
    }

    # Handle React Router — $uri.html serves the prerendered page without the
    # trailing-slash redirect a directory lookup ($uri/) would trigger.
    # Every app route is prerendered, so anything left over is a genuine 404:
    # falling back to /index.html here would answer 200 and create soft 404s.
    location / {
        try_files $uri $uri.html =404;
    }

    # The home page is a directory, which the try_files above never matches
    # (no $uri/ on purpose), so route it explicitly to the prerendered
    # index.html. Query args are kept.
    location = / {
        if ($legacy_category) {
            return 301 $legacy_category$search_query_suffix;
        }
        rewrite ^ /index.html last;
    }

    # Reached internally from `location = /`; a direct request for
    # /index.html is a duplicate of the home page.
    location = /index.html {
        if ($request_uri ~ ^/index\.html) {
            return 301 /$is_args$args;
        }
    }

    # Browsers and crawlers ask for /favicon.ico regardless of the <link>.
    location = /favicon.ico {
        try_files /favicon.png =404;
        access_log off;
        log_not_found off;
    }

    # Liveness probe for status-api. Without it the request falls through to
    # the =404 above. default_type instead of add_header keeps the server-level
    # headers.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Error pages — served with a real 404 status (no `=200` rewrite), so
    # Google records a hard 404 instead of a soft 404.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
