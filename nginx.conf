server {
    listen 80;
    server_name blog.jesusflorez.cloud;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. Behind the TLS proxy nginx only listens on
    # port 80, so absolute redirects would downgrade https:// links to http://.
    absolute_redirect off;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Canonical URLs carry no trailing slash (sitemap, canonical, JSON-LD all
    # agree). Consolidate the slash variant Google already crawled.
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # Handle React Router — $uri.html serves the prerendered page without the
    # trailing-slash redirect a directory lookup ($uri/) would trigger.
    # Every app route is prerendered, so anything left over is a genuine 404:
    # falling back to /index.html here would answer 200 and create soft 404s.
    location / {
        try_files $uri $uri.html =404;
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Error pages — served with a real 404 status (no `=200` rewrite), so
    # Google records a hard 404 instead of a soft 404.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
